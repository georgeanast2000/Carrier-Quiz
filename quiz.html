    };

    const resultsData = {
        STEM: { title: "Τεχνολογικός & Ερευνητικός Τύπος", desc: "Είσαι άτομο που βασίζεται στη λογική, την παρατήρηση και την απόδειξη. Σου ταιριάζουν οι θετικές επιστήμες, η πληροφορική και η τεχνολογία αιχμής. Διαθέτεις ικανότητες επίλυσης σύνθετων προβλημάτων.", unis: ["ΕΜΠ (Πολυτεχνείο)", "ΟΠΑ (Πληροφορική)", "ΕΚΠΑ (Φυσικομαθηματικό)", "ΑΠΘ (Μηχανικών Η/Υ)", "ΠΑΠΕΙ (Ψηφιακά Συστήματα)"] },
        HUMAN: { title: "Κοινωνικός & Ανθρωπιστικός Τύπος", desc: "Η ενσυναίσθηση, η κοινωνική προσφορά και η επικοινωνία είναι τα δυνατά σου σημεία. Σου ταιριάζουν επαγγέλματα που εστιάζουν στην υποστήριξη, τη διδασκαλία και την ανάλυση της ανθρώπινης φύσης.", unis: ["ΕΚΠΑ (Νομική)", "Πάντειο (Ψυχολογία)", "ΕΚΠΑ (Φιλοσοφική)", "ΑΠΘ (Παιδαγωγικά)", "Πάντειο (Κοινωνιολογία)"] },
        ECON: { title: "Επιχειρηματικός & Διοικητικός Τύπος", desc: "Είσαι γεννημένος ηγέτης με στρατηγική σκέψη και οργανωτικό πνεύμα. Σου ταιριάζει ο δυναμικός κόσμος των επιχειρήσεων, των οικονομικών και της διοίκησης μεγάλων οργανισμών.", unis: ["ΟΠΑ (ΔΕΤ)", "ΠΑΜΑΚ (Οικονομικά)", "ΟΠΑ (ΑΣΟΕΕ)", "ΠΑΠΕΙ (Ναυτιλιακά)", "Πάντειο (Marketing)"] },
        ARTS: { title: "Καλλιτεχνικός & Δημιουργικός Τύπος", desc: "Η έκφραση, η πρωτοτυπία και η αισθητική είναι η κινητήριος δύναμή σου. Σου ταιριάζει η τέχνη, ο δημιουργικός σχεδιασμός και κάθε περιβάλλον που επιτρέπει την ελεύθερη φαντασία.", unis: ["ΑΣΚΤ (Καλών Τεχνών)", "ΕΜΠ (Αρχιτεκτονική)", "ΠΑΔΑ (Γραφιστική)", "ΑΠΘ (Κινηματογράφου)", "Ιόνιο (Μουσικών Σπουδών)"] }
    };

    let activeQuestions = [];
    let currentIdx = 0;
    let scores = { STEM: 0, HUMAN: 0, ECON: 0, ARTS: 0 };

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function prepareQuiz() {
        activeQuestions = [];
        const questionsPerCategory = 5;

        for (let cat in rawQuestions) {
            let shuffledCat = shuffle([...rawQuestions[cat]]);
            let selected = shuffledCat.slice(0, questionsPerCategory).map(q => ({ text: q, category: cat }));
            activeQuestions.push(...selected);
        }
        activeQuestions = shuffle(activeQuestions);
        renderQuestion();
    }

    function renderQuestion() {
        const q = activeQuestions[currentIdx];
        document.getElementById("progress").style.width = (currentIdx / activeQuestions.length) * 100 + "%";
        document.getElementById("counter").innerText = `Ερώτηση ${currentIdx + 1} / ${activeQuestions.length}`;
        document.getElementById("question-text").innerText = q.text;
    }

    function handleAnswer(points) {
        const cat = activeQuestions[currentIdx].category;
        scores[cat] += points;
        currentIdx++;

        if (currentIdx < activeQuestions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        const data = resultsData[winner];

        document.getElementById("res-title").innerText = data.title;
        document.getElementById("res-desc").innerText = data.desc;
        
        const uniDiv = document.getElementById("res-unis");
        uniDiv.innerHTML = "";
        data.unis.forEach(u => {
            uniDiv.innerHTML += `<span class="uni-tag">${u}</span>`;
        });
    }

    prepareQuiz();
</script>

</body>
</html>
