<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CareerQuest Results</title><link rel="stylesheet" href="css/style.css"></head><body><main><div class="panel"><h1>Τα αποτελέσματά σου</h1><div id="results"></div><div class="top-actions"><button onclick="restartQuiz()">Ξεκίνα ξανά</button></div></div></main><script>
const careers=[{"title": "Πληροφορική / Software Development", "description": "Κατεύθυνση για άτομα με αναλυτική σκέψη, επιμονή και ενδιαφέρον για τεχνολογία.", "requiredSkills": {"analytical": 6, "organized": 3}}, {"title": "Design / Δημιουργικά επαγγέλματα", "description": "Κατεύθυνση για άτομα με δημιουργικότητα, αισθητική και παραγωγή ιδεών.", "requiredSkills": {"creative": 6}}, {"title": "Εκπαίδευση / Κοινωνικά επαγγέλματα", "description": "Κατεύθυνση για άτομα με επικοινωνία, συνεργασία και διάθεση υποστήριξης άλλων.", "requiredSkills": {"social": 6, "organized": 2}}, {"title": "Μηχανική / Τεχνικά επαγγέλματα", "description": "Κατεύθυνση για άτομα με πρακτική σκέψη, τεχνική αντίληψη και επίλυση προβλημάτων.", "requiredSkills": {"practical": 5, "analytical": 3}}, {"title": "Διοίκηση / Project Management", "description": "Κατεύθυνση για άτομα που οργανώνουν, συντονίζουν και βάζουν προτεραιότητες.", "requiredSkills": {"organized": 6, "leadership": 3}}, {"title": "Marketing / Επικοινωνία", "description": "Κατεύθυνση για άτομα με δημιουργικότητα, κοινωνικότητα και κατανόηση κοινού.", "requiredSkills": {"creative": 4, "social": 4}}];
const skillLabels={analytical:'Αναλυτική σκέψη',creative:'Δημιουργικότητα',social:'Κοινωνικές δεξιότητες',practical:'Πρακτική σκέψη',organized:'Οργάνωση',leadership:'Ηγεσία / Συντονισμός'};
function getSkills(){return JSON.parse(localStorage.getItem('careerquest_skills'))||{analytical:0,creative:0,social:0,practical:0,organized:0,leadership:0};}
function matchCareers(skills){return careers.map(c=>{let score=0;for(const key in c.requiredSkills){score+=Math.min(skills[key]||0,c.requiredSkills[key]);}return {...c,score};}).sort((a,b)=>b.score-a.score);}
function coach(skills){const sorted=Object.entries(skills).sort((a,b)=>b[1]-a[1]);const top=sorted[0]?.[0];const msg={analytical:'Έχεις ισχυρή τάση προς λογική σκέψη και επίλυση προβλημάτων.',creative:'Δείχνεις έντονη δημιουργικότητα και άνεση στην παραγωγή ιδεών.',social:'Δείχνεις κλίση στην επικοινωνία, συνεργασία και υποστήριξη άλλων.',practical:'Έχεις πρακτικό τρόπο σκέψης και προτίμηση σε εφαρμοσμένες λύσεις.',organized:'Δείχνεις καλή οργάνωση και ικανότητα διαχείρισης προτεραιοτήτων.',leadership:'Δείχνεις τάση για συντονισμό, ανάληψη πρωτοβουλίας και καθοδήγηση ομάδας.'};return msg[top]||'Το προφίλ σου είναι ισορροπημένο και ανοίγει διαφορετικές επιλογές.';}
function showResults(){const skills=getSkills();const max=Math.max(...Object.values(skills),1);const matches=matchCareers(skills).slice(0,3);document.getElementById('results').innerHTML=`<div class="ok">Τα αποτελέσματα είναι ενδεικτικά και όχι επίσημο ψυχομετρικό τεστ.</div><div class="result-card"><h2>Προφίλ δεξιοτήτων</h2>${Object.entries(skills).map(([k,v])=>`<div class="skill-row"><strong>${skillLabels[k]||k}</strong><span>${v}</span></div><div class="bar"><div class="fill" style="width:${Math.round((v/max)*100)}%"></div></div>`).join('')}</div><div class="result-card"><h2>Coach feedback</h2><p>${coach(skills)}</p></div><div class="result-card"><h2>Προτεινόμενες κατευθύνσεις</h2>${matches.map(c=>`<div class="career-card"><h3>${c.title}</h3><p>${c.description}</p><p><strong>Match score:</strong> ${c.score}</p></div>`).join('')}</div>`;}
function restartQuiz(){localStorage.removeItem('careerquest_skills');window.location.href='index.html';}
showResults();
</script></body></html>
